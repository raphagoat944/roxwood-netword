<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace Membre — Roxwood Network</title>
  <meta name="description" content="Espace réservé aux membres Roxwood Network.">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div data-header></div>

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow reveal">Accès réservé</span>
      <h1 class="reveal" data-delay="60">Espace Membre <span class="text-grad">Roxwood Network</span></h1>
      <p class="section-lead reveal" data-delay="120">
        Connectez-vous pour accéder à votre espace personnel et aux outils internes de l'agence.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:520px">

      <form class="panel form reveal" data-login-form autocomplete="off">
        <div>
          <span class="status"><i></i>Serveur accessible</span>
          <h2 style="font-size:1.4rem;margin-top:.6rem">Connexion sécurisée</h2>
        </div>

        <div class="field">
          <label for="identifiant">Identifiant</label>
          <input id="identifiant" name="identifiant" type="text" placeholder="votre identifiant" required>
        </div>

        <div class="field">
          <label for="motdepasse">Mot de passe</label>
          <input id="motdepasse" name="motdepasse" type="password" placeholder="••••••••" required>
        </div>

        <div class="alert alert--error"></div>
        <div class="alert alert--ok"></div>

        <button class="btn btn--primary btn--block" type="submit">Connexion</button>
        <p class="form-note">
          Accès de démonstration : <b>invite</b> / <b>demo</b>.
        </p>
      </form>

    </div>
  </section>

  <div data-footer></div>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
