<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview projet — Roxwood Network</title>
  <meta name="description" content="Aperçu détaillé d'une réalisation Roxwood Network : visuels, contexte du projet et accès au site en ligne.">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div data-header></div>

  <section class="page-hero">
    <div class="container">
      <span class="tag" data-preview-type>Projet</span>
      <h1 style="margin-top:1rem" data-preview-title>Réalisation</h1>
      <p class="section-lead" data-preview-lead></p>
    </div>
  </section>

  <section class="section">
    <div class="container grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:2.5rem" id="preview-layout">

      <!-- Slider d'images -->
      <div class="slider reveal" data-slider>
        <div class="slider__track">
          <img src="img/project-1.jpg" alt="Visuel 1 du projet" data-slide="0">
          <img src="img/project-2.jpg" alt="Visuel 2 du projet" data-slide="1">
          <img src="img/project-3.jpg" alt="Visuel 3 du projet" data-slide="2">
        </div>
        <button class="slider__nav slider__nav--prev" type="button" aria-label="Image précédente">&#8249;</button>
        <button class="slider__nav slider__nav--next" type="button" aria-label="Image suivante">&#8250;</button>
        <div class="slider__dots"></div>
      </div>

      <!-- Fiche projet -->
      <aside class="panel reveal reveal--right" data-delay="120">
        <h2 style="font-size:1.3rem">Fiche du projet</h2>
        <p style="color:var(--grey);margin-top:.8rem" data-preview-desc></p>
        <ul class="feature-list" style="margin-top:1.6rem">
          <li><i class="dot"></i><div><b>Livrable</b><span data-preview-deliverable></span></div></li>
          <li><i class="dot"></i><div><b>Délai</b><span>3 à 10 jours selon le périmètre</span></div></li>
          <li><i class="dot"></i><div><b>Suivi</b><span>Maintenance et évolutions incluses</span></div></li>
        </ul>
        <a class="btn btn--primary btn--block" style="margin-top:1.8rem" target="_blank" rel="noopener" data-preview-link>Explorer le site</a>
        <a class="btn btn--ghost btn--block" style="margin-top:.7rem" href="portfolio.html">Retour au portfolio</a>
      </aside>

    </div>
  </section>

  <div data-footer></div>
  <script src="js/main.js"></script>
  <script>
    /* Contenu de la preview selon le paramètre ?p= (1, 2 ou 3). */
    (function () {
      var PROJECTS = {
        "1": {
          type: "Entreprise légale",
          title: "Roxwood Entreprise",
          lead: "Vitrine corporate d'une société implantée en centre-ville.",
          desc: "Structure claire en plusieurs pages, présentation des pôles d'activité, mise en avant des services et point de contact unique pour les clients comme pour les partenaires.",
          deliverable: "Site vitrine multi-pages + formulaire",
          url: "http://51.255.173.188/accueil.html"
        },
        "2": {
          type: "Agence / Domaine",
          title: "Marlowe Vineyard",
          lead: "Domaine viticole familial, image haut de gamme et réservation d'événements.",
          desc: "Direction artistique chaleureuse, présentation des cuvées, galerie du domaine et prise de contact pour les visites, dégustations et privatisations.",
          deliverable: "Vitrine premium + galerie + contact",
          url: "https://poulpizar01.github.io/Marlowe-Vineyard/index.html"
        },
        "3": {
          type: "Organisation illégale",
          title: "LaMaja13",
          lead: "Interface confidentielle pour une organisation qui tient à sa discrétion.",
          desc: "Navigation minimale, ambiance nocturne, sections accessibles par lien direct et espace réservé aux membres reconnus par l'organisation.",
          deliverable: "Interface dark + accès restreint",
          url: "https://lamaja13.duckdns.org/"
        }
      };

      var id = new URLSearchParams(window.location.search).get("p") || "1";
      var p = PROJECTS[id] || PROJECTS["1"];

      document.title = p.title + " — Roxwood Network";
      document.querySelector("[data-preview-type]").textContent = p.type;
      document.querySelector("[data-preview-title]").textContent = p.title;
      document.querySelector("[data-preview-lead]").textContent = p.lead;
      document.querySelector("[data-preview-desc]").textContent = p.desc;
      document.querySelector("[data-preview-deliverable]").textContent = p.deliverable;
      document.querySelector("[data-preview-link]").href = p.url;

      /* Le premier visuel du slider correspond au projet affiché. */
      var first = document.querySelector('[data-slide="0"]');
      if (first) first.src = "img/project-" + (PROJECTS[id] ? id : "1") + ".jpg";
    })();
  </script>
  <style>
    @media (max-width: 900px) { #preview-layout { grid-template-columns: 1fr !important; } }
  </style>
</body>
</html>
