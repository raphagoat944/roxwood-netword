<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roxwood Network — Studio Digital</title>
<meta name="description" content="Roxwood Network, studio digital : sites vitrines, portails internes et interfaces sur mesure.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
</script>
<style>
  :root{
    --navy-950:#05070f;
    --navy-900:#080d1c;
    --cyan:#22d3ff;
    --magenta:#d926c6;
    --text:#e8f0ff;
    --muted:#8ea3c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--navy-950);
    color:var(--text);
    font-family:"Inter",system-ui,sans-serif;
    overflow:hidden;
  }
  #stars{position:fixed;inset:0;display:block;z-index:0}
  .glow{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(900px 620px at 50% 42%, rgba(34,211,255,.20), transparent 70%),
      radial-gradient(700px 520px at 50% 90%, rgba(217,38,198,.16), transparent 70%),
      radial-gradient(1200px 900px at 50% 50%, rgba(5,7,15,0) 40%, rgba(5,7,15,.85) 100%);
  }
  .splash{
    position:relative;z-index:2;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem 1.25rem 4rem;
    gap:.6rem;
  }
  .splash__3d{
    width:min(80vw,400px);
    height:min(80vw,400px);
    margin:-30px 0;
    cursor:grab;touch-action:pan-y;
    opacity:0;transition:opacity 1s ease;
    animation:float 6s ease-in-out infinite;
    filter:drop-shadow(0 0 46px rgba(34,211,255,.45)) drop-shadow(0 0 110px rgba(217,38,198,.25));
  }
  .splash__3d.is-ready{opacity:1}
  .splash__3d:active{cursor:grabbing}
  .splash__3d canvas{width:100%!important;height:100%!important;display:block}
  .splash__hint{
    font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:#54648a;
    animation:appear 1.2s .8s ease both;
  }
  .splash__eyebrow{
    font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);
    animation:appear 1.1s .2s ease both;
  }
  .splash__title{
    font-family:"Poppins",sans-serif;font-weight:700;
    font-size:clamp(2.4rem,8vw,5.2rem);line-height:1.05;
    background:linear-gradient(100deg,#ffffff 10%,var(--cyan) 45%,var(--magenta) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(34,211,255,.18);
    animation:appear 1.1s .3s ease both;
  }
  .splash__tag{
    font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;color:#b9c9e6;
    animation:appear 1.1s .45s ease both;
  }
  .splash__enter{
    margin-top:1.4rem;
    display:inline-flex;align-items:center;gap:.6rem;
    padding:.95rem 2.6rem;border-radius:999px;
    font-family:"Poppins",sans-serif;font-weight:600;
    letter-spacing:.24em;text-transform:uppercase;font-size:.78rem;
    color:#04101c;text-decoration:none;
    background:linear-gradient(120deg,var(--cyan),#7c5cff 55%,var(--magenta));
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 14px 40px rgba(34,211,255,.32);
    transition:transform .3s ease, box-shadow .3s ease, filter .3s ease;
    animation:appear 1.1s .6s ease both, pulse 3.4s ease-in-out 1.6s infinite;
  }
  .splash__enter:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 18px 54px rgba(217,38,198,.42);filter:brightness(1.06)}
  .splash__foot{
    position:fixed;bottom:1.4rem;left:0;right:0;z-index:2;
    text-align:center;font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;
    color:#54648a;pointer-events:none;
    animation:appear 1.4s .9s ease both;
  }
  @keyframes float{0%,100%{transform:translateY(-6px)}50%{transform:translateY(10px)}}
  @keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 14px 40px rgba(34,211,255,.30)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.2),0 18px 56px rgba(217,38,198,.45)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow"></div>

<main class="splash">
  <div class="splash__3d" data-hero3d data-zoom-base="4.4" data-zoom-min="3.4" data-zoom-max="6" aria-label="Cristal néon Roxwood Network — glissez pour le manipuler"></div>
  <p class="splash__hint">Glissez le cristal · molette pour zoomer</p>
  <p class="splash__eyebrow">Los Santos · Studio Digital</p>
  <h1 class="splash__title">Roxwood Network</h1>
  <p class="splash__tag">Conception · Systèmes · Sur mesure</p>
  <a class="splash__enter" href="home.html">Entrer</a>
</main>

<p class="splash__foot">Espace membres · Portails &amp; interfaces sécurisées</p>

<script>
  // Ciel spatial animé : dérive lente, scintillement, filantes et "warp" léger.
  (function () {
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, dpr = 1, cx = 0, cy = 0;
    let stars = [], shooters = [];

    function build() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = innerWidth * dpr;
      h = canvas.height = innerHeight * dpr;
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      cx = w / 2; cy = h / 2;
      const count = Math.round((innerWidth * innerHeight) / 4200);
      stars = Array.from({ length: count }, spawn);
    }

    function spawn(edge) {
      // Naissance près du centre pour l'effet de profondeur (voyage dans l'espace)
      const ang = Math.random() * Math.PI * 2;
      const rad = edge ? Math.random() * 30 : Math.random() * Math.max(w, h) * 0.5;
      return {
        x: cx + Math.cos(ang) * rad,
        y: cy + Math.sin(ang) * rad * 0.8,
        px: 0, py: 0, first: true,
        z: Math.random() * 0.85 + 0.15,          // profondeur : vitesse & taille
        tw: Math.random() * Math.PI * 2,          // phase de scintillement
        hue: Math.random() > 0.84 ? "217,38,198" : (Math.random() > 0.5 ? "34,211,255" : "230,240,255")
      };
    }

    function spawnShooter() {
      const x = Math.random() * w * 0.7;
      const y = Math.random() * h * 0.35;
      const ang = Math.PI * (0.15 + Math.random() * 0.2);
      shooters.push({ x, y, vx: Math.cos(ang) * 14 * dpr, vy: Math.sin(ang) * 14 * dpr, life: 1 });
    }

    let t = 0;
    function frame() {
      t += 0.016;
      ctx.clearRect(0, 0, w, h);

      // Étoiles en dérive centrifuge (voyage dans l'espace)
      for (let i = 0; i < stars.length; i++) {
        const st = stars[i];
        const dx = st.x - cx, dy = st.y - cy;
        const speed = (0.35 + st.z * 1.6) * dpr;
        const len = Math.hypot(dx, dy) || 1;
        st.x += (dx / len) * speed * st.z;
        st.y += (dy / len) * speed * st.z - 0.06 * st.z * dpr;

        if (st.x < -40 || st.x > w + 40 || st.y < -40 || st.y > h + 40) {
          stars[i] = spawn(true);
          continue;
        }

        const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * (0.6 + st.z) + st.tw));
        const r = (0.3 + st.z * 1.5) * dpr;

        // Traînée de mouvement (effet warp)
        if (!st.first) {
          ctx.beginPath();
          ctx.moveTo(st.px, st.py);
          ctx.lineTo(st.x, st.y);
          ctx.strokeStyle = "rgba(" + st.hue + "," + (tw * 0.45 * st.z).toFixed(3) + ")";
          ctx.lineWidth = r;
          ctx.stroke();
        }
        st.px = st.x; st.py = st.y; st.first = false;

        ctx.beginPath();
        ctx.arc(st.x, st.y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + st.hue + "," + tw.toFixed(3) + ")";
        ctx.shadowBlur = r * 5;
        ctx.shadowColor = "rgba(" + st.hue + ",.55)";
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Étoiles filantes occasionnelles
      if (Math.random() < 0.006 && shooters.length < 3) spawnShooter();
      for (let i = shooters.length - 1; i >= 0; i--) {
        const s = shooters[i];
        s.x += s.vx; s.y += s.vy; s.life -= 0.018;
        if (s.life <= 0 || s.x > w + 80 || s.y > h + 80) { shooters.splice(i, 1); continue; }
        const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 6, s.y - s.vy * 6);
        grad.addColorStop(0, "rgba(240,250,255," + (s.life * 0.9).toFixed(3) + ")");
        grad.addColorStop(1, "rgba(34,211,255,0)");
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.vx * 6, s.y - s.vy * 6);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.6 * dpr;
        ctx.stroke();
      }

      requestAnimationFrame(frame);
    }

    build();
    addEventListener("resize", build);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      frame();
    } else {
      ctx.clearRect(0, 0, w, h);
      stars.forEach((st) => {
        ctx.beginPath();
        ctx.arc(st.x, st.y, (0.4 + st.z) * dpr, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(230,240,255,.7)";
        ctx.fill();
      });
    }
  })();
</script>
<script type="module" src="js/hero3d.js"></script>
</body>
</html>
