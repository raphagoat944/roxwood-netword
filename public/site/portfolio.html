<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Roxwood Network</title>
  <meta name="description" content="Explorez les réalisations de Roxwood Network : Dynasty 8, Marlowe Vineyard et La Maja 13, avec preview interactive.">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div data-header></div>

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow reveal">Réalisations</span>
      <h1 class="reveal" data-delay="60">Portfolio <span class="text-grad">Roxwood Network</span></h1>
      <p class="section-lead reveal" data-delay="120">
        Explorez nos réalisations : ouvrez la preview, parcourez les captures réelles du site,
        puis cliquez sur l'aperçu pour accéder directement au site en ligne.
      </p>
    </div>
  </section>

  <section class="section">
    <!-- Grille générée par js/portfolio.js -->
    <div class="container grid grid--3" data-portfolio-grid></div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="cta-band reveal">
        <h2 class="section-title">Votre organisation mérite la même finition</h2>
        <a class="btn btn--primary" style="margin-top:1.6rem" href="https://discord.com/invite/dZDfarP8zT" target="_blank" rel="noopener">Lancer mon projet</a>
      </div>
    </div>
  </section>

  <div data-footer></div>
  <script src="js/portfolio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
